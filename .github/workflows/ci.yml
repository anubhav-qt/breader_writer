# Every push and pull request: type checks (the app's build among them), lint, and the server's
# tests against the dev Postgres and the stand-ins for breader and CLIProxyAPI. Pushes to dev then
# publish the server image, which the laptop picks up itself (infra/update.sh) and migrates to
# before it starts (the compose migrate service). Cloudflare's Workers Builds builds and deploys
# the app from the same commit (frontend/wrangler.jsonc). No secrets: GITHUB_TOKEN is enough.
name: ci

on:
  push: { branches: [dev] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - name: Start the dev Postgres
        run: docker compose -f infra/compose.dev.yml up -d --wait
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -w frontend
      - run: npm test

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breader-writer" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # amd64 for the laptop, arm64 in case the stack ever runs on a Mac, as breader's does.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: RELEASE=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
